name: PH IOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Extrair projeto ZIP
        run: |
          set -e

          ZIP="Nubank-Run16-DreamXiter-Project.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERRO: $ZIP não encontrado"
            ls -lah
            exit 1
          fi

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          echo "Projeto extraído:"
          find extracted -name "*.xcodeproj" -print

      - name: Encontrar projeto e scheme
        run: |
          set -e

          PROJECT=$(find extracted -name "ThreeOneOSFive.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: ThreeOneOSFive.xcodeproj não encontrado"
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Projetos encontrados:"
          find extracted -name "*.xcodeproj" -print

          echo "Schemes:"
          xcodebuild -list -project "$PROJECT"

      - name: Compilar IPA
        run: |
          set -e

          rm -rf build Payload 3105.ipa

          xcodebuild \
            -project "$PROJECT" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Criar IPA
        run: |
          set -e

          mkdir -p Payload

          APP=$(find build/Build/Products -name "3105.app" -type d -print -quit)

          if [ -z "$APP" ]; then
            echo "ERRO: 3105.app não foi gerado"
            find build/Build/Products -maxdepth 3 -type d -print
            exit 1
          fi

          echo "APP encontrado: $APP"

          cp -R "$APP" Payload/3105.app

          zip -qry 3105.ipa Payload

          ls -lh 3105.ipa

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: PHIOS-3105-IPA
          path: 3105.ipa
          if-no-files-found: error
