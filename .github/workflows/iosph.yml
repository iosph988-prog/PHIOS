name: Build IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Encontrar projeto Xcode
        run: |
          echo "Arquivos do projeto:"
          find . -name "*.xcodeproj" -print

          PROJECT=$(find . -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: nenhum .xcodeproj encontrado"
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Verificar projeto
        run: |
          echo "Projeto: $PROJECT"
          xcodebuild -list -project "$PROJECT"

      - name: Compilar
        run: |
          xcodebuild \
            -project "$PROJECT" \
            -scheme "3105" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build

      - name: Criar IPA
        run: |
          mkdir -p Payload

          APP=$(find build/Build/Products -name "*.app" -type d -print -quit)

          if [ -z "$APP" ]; then
            echo "ERRO: nenhum .app foi gerado"
            exit 1
          fi

          echo "App encontrado: $APP"
          cp -R "$APP" Payload/

          zip -r 3105.ipa Payload

      - name: Enviar IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: 3105.ipa
