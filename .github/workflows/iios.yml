name: Build PH IOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto
        shell: bash
        run: |
          set -euo pipefail

          rm -rf source build dist
          mkdir -p source build dist

          ARCHIVE=$(find . -maxdepth 1 -type f -name "*.tar.gz" | head -n 1)

          if [ -z "$ARCHIVE" ]; then
            echo "ERRO: nenhum .tar.gz encontrado."
            ls -lah
            exit 1
          fi

          echo "Pacote encontrado: $ARCHIVE"

          tar -xzf "$ARCHIVE" -C source

          INNER=$(find source -type f -name "*.tar.gz" | head -n 1)

          if [ -z "$INNER" ]; then
            echo "ERRO: pacote interno .tar.gz não encontrado."
            find source -maxdepth 5 -print
            exit 1
          fi

          echo "Pacote interno: $INNER"

          mkdir -p source/project
          tar -xzf "$INNER" -C source/project

          PROJECT=$(find source/project -type d -name "*.xcodeproj" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: nenhum .xcodeproj encontrado."
            find source/project -maxdepth 6 -print
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT"

      - name: Mostrar schemes
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild \
            -project "$PROJECT" \
            -list

      - name: Compilar IPA
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/Payload

          xcodebuild \
            -project "$PROJECT" \
            -scheme 3105 \
            -sdk iphoneos \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/3105.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

          APP=$(find \
            build/3105.xcarchive/Products/Applications \
            -maxdepth 1 \
            -type d \
            -name "*.app" \
            -print \
            -quit)

          if [ -z "$APP" ]; then
            echo "ERRO: aplicativo .app não foi gerado."
            exit 1
          fi

          echo "APP encontrado: $APP"

          cp -R "$APP" build/Payload/

          cd build

          /usr/bin/zip \
            -qry \
            "$GITHUB_WORKSPACE/dist/PHIOS.ipa" \
            Payload

          test -s "$GITHUB_WORKSPACE/dist/PHIOS.ipa"

          echo "IPA criado:"
          ls -lh "$GITHUB_WORKSPACE/dist/PHIOS.ipa"

      - name: Publicar IPA
        uses: actions/upload-artifact@v4
        with:
          name: PHIOS-IPA
          path: dist/PHIOS.ipa
          if-no-files-found: error
          retention-days: 7
