name: Build Theos tweak

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    # O Theos funciona em Linux; não é necessário depender de macOS-13.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: ${{ runner.temp }}/theos

      - name: Build rootless package
        working-directory: Sile
        env:
          THEOS: ${{ runner.temp }}/theos
        run: |
          set -euo pipefail
          make clean package \
            THEOS="$THEOS" \
            FINALPACKAGE=1 \
            DEBUG=0 \
            IGNORE_WARNINGS=1

      - name: Verify package
        working-directory: Sile
        run: |
          set -euo pipefail
          test -n "$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          find packages -maxdepth 1 -type f -name '*.deb' -print

      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: PHBOLSONARO-rootless-package
          path: Sile/packages/*.deb
          if-no-files-found: error
          retention-days: 14
