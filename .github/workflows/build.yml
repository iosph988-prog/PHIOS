- name: Extract project
  run: |
    set -euo pipefail
    mkdir -p extracted
    unzip -q Prj-fixed.zip -d extracted
    PROJECT_DIR="<LaTex>(find extracted -name Makefile -type f -printf '%h\n' | head -n 1)"     test -n "</LaTex>PROJECT_DIR"
    echo "PROJECT_DIR=<LaTex>PROJECT_DIR" >> "</LaTex>GITHUB_ENV"
    echo "Projeto encontrado em: <LaTex>PROJECT_DIR" ```  Se quiser que o workflow encontre automaticamente qualquer ZIP existente, use esta versão mais resistente:  ```yaml - name: Extract project   shell: bash   run: |     set -euo pipefail     mkdir -p extracted     ZIP_FILE="</LaTex>(find . -maxdepth 1 -type f -iname '*.zip' ! -name 'theos.zip' -printf '%f\n' | sort | head -n 1)"
    test -n "<LaTex>ZIP_FILE" || { echo 'Nenhum ZIP encontrado'; exit 1; }     echo "Extraindo:</LaTex>ZIP_FILE"
    unzip -q "<LaTex>ZIP_FILE" -d extracted     PROJECT_DIR="</LaTex>(find extracted -name Makefile -type f -printf '%h\n' | head -n 1)"
    test -n "<LaTex>PROJECT_DIR" || { echo 'Makefile não encontrado dentro do ZIP'; find extracted -maxdepth 3 -type f; exit 1; }     echo "PROJECT_DIR=</LaTex>PROJECT_DIR" >> "<LaTex>GITHUB_ENV"     echo "Projeto encontrado em:</LaTex>PROJECT_DIR"
