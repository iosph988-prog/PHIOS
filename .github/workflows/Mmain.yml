- name: Preparar projeto
  shell: bash
  run: |
    set -euo pipefail

    PKG="$(find "$GITHUB_WORKSPACE" -maxdepth 2 \
      -type f -name 'PH_XITER_nubank_logs_names_overlay_v3.tar.gz' \
      | head -n 1)"

    if [ -z "$PKG" ]; then
      echo "ERRO: pacote PH_XITER não encontrado."
      exit 1
    fi

    echo "Pacote encontrado:"
    echo "$PKG"

    rm -rf source
    mkdir -p source

    tar -xzf "$PKG" -C source

    echo "Conteúdo extraído:"
    find source -maxdepth 4 -print

    PROJECT_DIR="source/ThreeOneOSFive"

    if [ ! -d "$PROJECT_DIR" ]; then
      echo "ERRO: $PROJECT_DIR não encontrado."
      exit 1
    fi

    # Corrige o nome do projeto Xcode
    if [ -f "source/ThreeOneOSFive.xcodeproj.project.pbxproj" ]; then
      mkdir -p "source/ThreeOneOSFive.xcodeproj"
      mv "source/ThreeOneOSFive.xcodeproj.project.pbxproj" \
         "source/ThreeOneOSFive.xcodeproj/project.pbxproj"
    fi

    echo "Projeto preparado:"
    find source -maxdepth 3 -print
